<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #1f4d45; }
      body { font-family: Georgia, "Liberation Serif", serif; color: #f6f1e7; }
      .tile { box-sizing: border-box; height: 280px; padding: 28px 32px; display: flex; flex-direction: column; justify-content: space-between; }
      .brand { display: flex; gap: 14px; align-items: center; }
      .brand strong { font-size: 42px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; }
      .tag { font-family: "Segoe UI", "Liberation Sans", sans-serif; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
      .pain { font-family: "Segoe UI", "Liberation Sans", sans-serif; font-size: 16px; line-height: 1.35; color: #d5e4df; max-width: 360px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="brand">
        <svg width="64" height="64" viewBox="0 0 128 128" aria-hidden="true">
          <rect width="128" height="128" rx="28" fill="#F6F1E7"/>
          <path d="M88 64H50" stroke="#1F4D45" stroke-width="16" stroke-linecap="round"/>
          <path d="M66 40L42 64l24 24" fill="none" stroke="#1F4D45" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>Typeback</strong>
      </div>
      <p class="tag">Recover lost form text</p>
      <p class="pain">Lost a comment or email to a crash or a closed tab? Bring it back. Private, no passwords.</p>
    </div>
  </body>
</html>
